<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Duo Doors</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #161a3a; }
  body { font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #eef2f8; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; cursor: pointer; }
  .hud { position: fixed; pointer-events: none; text-shadow: 0 1px 3px #000a; }
  #lvl { top: max(12px, env(safe-area-inset-top)); left: max(14px, env(safe-area-inset-left)); font-weight: 800; font-size: 20px; line-height: 1.2; }
  #lvl small { display: block; font-size: 14px; font-weight: 600; opacity: .85; font-variant-numeric: tabular-nums; }
  #hint { top: max(12px, env(safe-area-inset-top)); right: max(14px, env(safe-area-inset-right)); width: min(330px, 46vw); text-align: right; font-size: 14px; color: #ffd98a; }
  #net { bottom: max(10px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); font-size: 12px; opacity: .75; white-space: nowrap; }
  #msg { top: 30%; left: 0; right: 0; text-align: center; font-size: 36px; font-weight: 900; color: #ffd23f; transition: opacity .35s, transform .35s; opacity: 0; transform: scale(.8); }
  #msg.on { opacity: 1; transform: scale(1); }
  #over { position: fixed; inset: 0; display: grid; place-items: center; background: #0b1020b0; }
  #over[hidden], .pad[hidden] { display: none; }
  .card { width: min(360px, 90vw); max-height: 86vh; overflow: auto; padding: 22px; border-radius: 16px; background: #1e2550; border: 1px solid #ffffff22; text-align: center; box-sizing: border-box; }
  .card h2 { margin: 0 0 4px; font-size: 26px; color: #ffd23f; }
  .card h3 { margin: 14px 0 4px; font-size: 14px; color: #ffd23f; text-align: left; }
  .card ol { text-align: left; margin: 0; padding-left: 24px; font-size: 14px; } .card li span { float: right; font-variant-numeric: tabular-nums; }
  button.go { width: 100%; min-height: 48px; margin-top: 14px; border: 0; border-radius: 12px; background: #52d273; color: #07210f; font: 800 17px system-ui, sans-serif; cursor: pointer; }
  .pad { position: fixed; bottom: max(18px, env(safe-area-inset-bottom)); display: flex; gap: 12px; }
  .pad button { width: 78px; height: 78px; border-radius: 50%; border: 2px solid #ffffff66; background: #ffffff1c; color: #fff; font: 800 18px system-ui, sans-serif; touch-action: none; }
  .pad button.on { background: #ffffff55; }
  #padL { left: max(16px, env(safe-area-inset-left)); } #padR { right: max(16px, env(safe-area-inset-right)); }
  @media (max-width: 560px) { #hint { top: auto; bottom: calc(max(18px, env(safe-area-inset-bottom)) + 96px); left: 14px; right: 14px; width: auto; text-align: center; } }
</style>
<script src="https://cdn.multiplayeragent.com/sdk/mp.global.js"></script>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud" id="lvl"></div>
<div class="hud" id="hint"></div>
<div class="hud" id="msg"></div>
<div class="hud" id="net">Connecting…</div>
<div class="pad" id="padL" hidden><button data-k="left">◀</button><button data-k="right">▶</button></div>
<div class="pad" id="padR" hidden><button data-k="jump">JUMP</button></div>
<div id="over" hidden><div class="card">
  <h2>You all got out!</h2>
  <div id="doneTime"></div>
  <h3>Fastest runs</h3><ol id="board"><li>Loading…</li></ol>
  <button class="go" id="again">Play again</button>
</div></div>
<script>
/* ═══ DUO DOORS · a Multiplayer Agent starter ═══════════════════════════════════════════
 * Every door needs two players. Co-op, 2–4 players; a bot buddy joins when you're alone.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ speeds, timers, and the LEVELS: drawn as text maps (legend inside)
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   LEVELS ........ reads the text maps: walls, plates, doors, levers, the exit
 *   PHYSICS ....... one function moves anyone: run, jump, stand on walls, doors and heads
 *   RUN (HOST) .... which plates are pressed, which doors are open, level clear, next level
 *   BUDDY BOTS .... the helpers: hold a plate for you, swap sides, go where you tap
 *   ME ............ your own body. Each player writes only its own.
 *   DRAW .......... the level, doors sliding, players, sparkles
 *   HUD & DONE .... level name, timer, the final card, leaderboard
 *   INPUT ......... keyboard, touch buttons, tap to point
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - Each player writes its OWN entity: `p` (one JSON field: position, facing, animation,
 *     level key) about 12 times a second, `hb` (heartbeat) once a second, `n`/`c` once.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s),
 *     worked out every frame. It reads everyone's position, works out which plates are
 *     pressed, and writes ONE shared field `game` (id, version `v`, level, phase, open
 *     doors, latched doors, timers) only when something changes, plus `bots`. A new host
 *     adopts both from state and carries on.
 *   - Everyone collides with the doors the `game` field says are closed.
 *   - Intents to the host: "point" {x, y} (send your buddy there), "again" {} (new run).
 *   - ?attract plays offline with bots only (the preview video is recorded from it).
 *   - Leaderboard "fastest-run": all five levels from the start, stored as 3600000 - ms
 *     (boards keep the highest score), shown on the final card.
 */

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  seats: 2,            // bots fill the room up to this many players: alone, you get one buddy
  speed: 6,            // run speed, tiles/s
  jump: 13.9,          // jump speed: about 2.4 tiles high, so a 3-tile ledge needs a boost from a friend
  gravity: 40,
  clearFor: 2600,      // ms the "level clear" moment lasts
  doneFor: 25000,      // ms the final card shows before a new run starts
  board: "fastest-run",
  // Map legend: # wall · S spawn · E exit (everyone inside it clears the level)
  //   a b c  plates: door A/B/C is open while ANY of its plates is pressed
  //   k      duo plates: door K opens for good once ALL k plates are pressed at once
  //   x y    levers: touch one and door X/Y opens for good
  levels: [
    { name: "Hold the door", hint: "Stand on a plate to open its door. Your buddy can hold one for you.", map: [
      "####################",
      "#..........#.......#",
      "#..........#.......#",
      "#..........#.......#",
      "#..........#.......#",
      "#..........#.......#",
      "#....###...#.......#",
      "#..........A.......#",
      "#..........A....##.#",
      "#..........A.......#",
      "#S....a....A..a..EE#",
      "####################"] },
    { name: "Boost me up", hint: "Jump on a friend's head to reach the high ledge, then pull the lever.", map: [
      "####################",
      "#.............#....#",
      "#.............#....#",
      "#.............#....#",
      "#.............#....#",
      "#.............#....#",
      "#.............#....#",
      "#..........x..X....#",
      "#.....######..X....#",
      "#.............X....#",
      "#S............X..EE#",
      "####################"] },
    { name: "Together now", hint: "Purple plates need everyone at once: stand on both together.", map: [
      "####################",
      "#.......#....#.....#",
      "#.......#....#.....#",
      "#.......#....#.....#",
      "#.......#....#.....#",
      "#.......#....#.....#",
      "#.......#....#.....#",
      "#.......K....A.....#",
      "#.......K....A.....#",
      "#.......K....A.....#",
      "#Sk...k.K..a.A..aEE#",
      "####################"] },
    { name: "Up and over", hint: "Boost a friend onto the shelf to hold the plate up there.", map: [
      "####################",
      "#...........#......#",
      "#...........#......#",
      "#...........#......#",
      "#...........#......#",
      "#...........#......#",
      "#...........#......#",
      "#.......b...B......#",
      "#..#######..B......#",
      "#...........B......#",
      "#S..........B.b..EE#",
      "####################"] },
    { name: "Grand finale", hint: "Purple plates together, hold the yellow door, then boost up to the lever.", map: [
      "####################",
      "#.....#.....#....#.#",
      "#.....#.....#....#.#",
      "#.....#.....#....#.#",
      "#.....#.....#....#.#",
      "#.....#.....#....#.#",
      "#.....#.....#....#.#",
      "#.....K.....A...yY.#",
      "#.....K.....A..##Y.#",
      "#.....K.....A....YE#",
      "#Sk..kK..a..Aa...YE#",
      "####################"] },
  ],
};
const BOT_NAMES = ["Buddy", "Pal", "Chum", "Sidekick"];
const COLORS = ["#ff5d73", "#4dabff", "#ffd23f", "#52d273", "#c77dff", "#ff8c42"];
const LETTER_COLORS = { a: "#ffd23f", b: "#4dabff", c: "#ff6b6b", k: "#c77dff", x: "#52d273", y: "#ff8c42" };

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'duo-doors',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
let net = null, S = { entities: { players: {} }, shared: {} };
const seenHb = new Map();
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
const isHost = () => livePlayers()[0] === net.sessionId;

// ── LEVELS ──────────────────────────────────────────────────────────────────────────
/** A text map as lists: plates, doors (by letter), levers, exit tiles, spawn. */
function readLevel(def) {
  const L = { name: def.name, hint: def.hint, grid: def.map, rows: def.map.length, cols: def.map[0].length, plates: [], levers: [], exits: [], doors: {}, spawn: { x: 1.5, y: 1 } };
  def.map.forEach((row, y) => [...row].forEach((ch, x) => {
    if (ch === "S") L.spawn = { x: x + 0.5, y: y + 1 };
    else if (ch === "E") L.exits.push({ x, y });
    else if ("abck".includes(ch)) L.plates.push({ x, y, k: ch });
    else if ("xy".includes(ch)) L.levers.push({ x, y, k: ch });
    else if (/[A-Z]/.test(ch) && ch !== "S" && ch !== "E") (L.doors[ch] = L.doors[ch] || { k: ch, x, rows: [], open: 0 }).rows.push(y);
  }));
  return L;
}
const LEVELS = CONFIG.levels.map(readLevel);
const tileAt = (L, x, y) => (y < 0 || y >= L.rows || x < 0 || x >= L.cols ? "#" : L.grid[y][x]);
/** Is tile (x, y) solid? Walls always; a door unless its letter is in `open`. */
function solid(L, x, y, open) {
  const ch = tileAt(L, x, y);
  return ch === "#" || (/[A-Z]/.test(ch) && ch !== "S" && ch !== "E" && !open.includes(ch));
}
const inExit = (L, b) => L.exits.some((e) => Math.floor(b.x) === e.x && Math.floor(b.y - 0.5) === e.y);
const doorSide = (d, b) => Math.sign(b.x - (d.x + 0.5));

// ── PHYSICS ─────────────────────────────────────────────────────────────────────────
const BW = 0.7, BH = 0.95; // body size in tiles; x is the middle, y is the feet
function makeBody(x, y) { return { x, y, vx: 0, vy: 0, f: 1, ground: null, coyote: 0, jumpBuf: 0 }; }
function overlapsSolid(L, b, open) {
  for (let ty = Math.floor(b.y - BH + 0.001); ty <= Math.floor(b.y - 0.001); ty++)
    for (let tx = Math.floor(b.x - BW / 2 + 0.001); tx <= Math.floor(b.x + BW / 2 - 0.001); tx++) if (solid(L, tx, ty, open)) return { tx, ty };
  return null;
}
/** Move a body for dt with input { dir: -1|0|1, jump }. `others` are bodies you can stand on. Returns "jump", "land" or null. */
function stepBody(b, input, dt, L, open, others) {
  let ev = null;
  if (b.ground && b.ground.body) { b.x += b.ground.body.x - b.ground.px; b.y = b.ground.body.y - BH; } // ride whoever you stand on
  b.vx += (input.dir * CONFIG.speed - b.vx) * Math.min(1, dt * (b.ground ? 16 : 8));
  if (input.dir) b.f = input.dir;
  b.coyote = b.ground ? 0.1 : Math.max(0, b.coyote - dt);
  b.jumpBuf = input.jump ? 0.15 : Math.max(0, b.jumpBuf - dt);
  if (b.jumpBuf > 0 && b.coyote > 0) { b.vy = -CONFIG.jump; b.jumpBuf = b.coyote = 0; ev = "jump"; }
  b.vy = Math.min(22, b.vy + CONFIG.gravity * dt);
  b.x += b.vx * dt; // across, then stop at walls and closed doors
  const hx = overlapsSolid(L, b, open);
  if (hx) { b.x = b.x < hx.tx + 0.5 ? hx.tx - BW / 2 - 0.001 : hx.tx + 1 + BW / 2 + 0.001; b.vx = 0; } // out to the nearer side
  const prevY = b.y, was = b.ground; b.y += b.vy * dt; b.ground = null; // then up and down
  const hy = overlapsSolid(L, b, open);
  if (hy && b.vy > 0) { b.y = hy.ty - 0.001; b.vy = 0; b.ground = { tile: true }; }
  else if (hy && b.vy < 0) { b.y = hy.ty + 1 + BH + 0.001; b.vy = 0; }
  if (!b.ground && b.vy >= 0) for (const o of others) { // land on a head
    const top = o.y - BH;
    if (o !== b && prevY <= top + 0.05 && b.y >= top && Math.abs(b.x - o.x) < BW * 0.85) { b.y = top; b.vy = 0; b.ground = { body: o, px: o.x }; }
  }
  if (b.ground && b.ground.body) b.ground.px = b.ground.body.x;
  const stuck = overlapsSolid(L, b, open); // a door closed on you: step out to the nearer side
  if (stuck) b.x = b.x < stuck.tx + 0.5 ? stuck.tx - BW / 2 - 0.01 : stuck.tx + 1 + BW / 2 + 0.01;
  if (b.ground && !was) ev = ev || "land";
  return ev;
}

// ── RUN (HOST) ──────────────────────────────────────────────────────────────────────
const host = { bots: new Map(), wasHost: false, last: null, key: "", lastBots: 0 };
/** The run as state has it, or the host's own newer write that hasn't come back yet. `v` only goes up. */
function game() {
  const g = parse(S.shared.game, null);
  return host.last && isHost() && (!g || host.last.v > g.v) ? host.last : g;
}
function writeGame(g) { g = { ...g, v: (game()?.v ?? 0) + 1 }; host.last = g; net.setShared("game", JSON.stringify(g)); return g; }
const keyOf = (g) => `r${g.id}l${g.lv}`;
const newRun = (id) => { const t = Date.now(); return writeGame({ id, lv: 0, phase: "play", at: t, runAt: t, endsAt: 0, open: "", latched: "", times: [] }); };
const nextLevel = (lv) => (ATTRACT ? (lv === 0 ? 2 : 0) : lv + 1); // the preview loops the two levels the bots can solve alone

/** Everyone in this level as { id, x, y, bot, mine }: humans from their own reports, bots from the host. */
function bodies(g) {
  const out = [], key = keyOf(g), live = new Set(livePlayers());
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    if (id === net.sessionId) { if (me.key === key && !(ATTRACT && !me.auto)) out.push({ id, x: me.x, y: me.y, mine: true, name: myName }); continue; }
    const s = parse(p.p, null); if (s && s.k === key && live.has(id)) out.push({ id, x: s.x, y: s.y, name: p.n || "Player" });
  }
  for (const b of botList(key)) out.push({ id: b.i, x: b.x, y: b.y, bot: true, name: b.n });
  return out;
}
const onPlate = (p, b) => Math.abs(b.x - (p.x + 0.5)) < 0.55 && b.y > p.y + 0.6 && b.y <= p.y + 1.05;
const touching = (lv, b) => Math.abs(b.x - (lv.x + 0.5)) < 0.75 && b.y > lv.y + 0.2 && b.y - BH < lv.y + 1;
/** Which doors are open: plates held right now, plus anything latched by duo plates or levers. */
function workDoors(L, all, latched) {
  let open = latched;
  for (const k of "abc") if (L.plates.some((p) => p.k === k && all.some((b) => onPlate(p, b)))) open += k.toUpperCase();
  const duo = L.plates.filter((p) => p.k === "k");
  if (duo.length && !latched.includes("K") && duo.every((p) => all.some((b) => onPlate(p, b)))) { latched += "K"; open += "K"; }
  for (const lv of L.levers) if (!latched.includes(lv.k.toUpperCase()) && all.some((b) => touching(lv, b))) { latched += lv.k.toUpperCase(); open += lv.k.toUpperCase(); }
  return { open: [...new Set(open)].sort().join(""), latched };
}
function hostTick(dt, now) {
  if (!host.wasHost) { // adopt the bots exactly as state has them
    host.wasHost = true; host.bots.clear();
    const saved = parse(S.shared.bots, { k: "", list: [] });
    for (const s of saved.list || []) host.bots.set(s.i, Object.assign(makeBody(s.x, s.y), { id: s.i, name: s.n, color: s.c, f: s.f, task: { type: "follow" }, point: s.pt || null }));
    host.key = saved.k || "";
  }
  let g = game();
  if (!g) g = newRun(1);
  const L = LEVELS[g.lv];
  if (host.key !== keyOf(g)) resetBots(g, L);
  const t = Date.now(), all = bodies(g);
  if (g.phase === "play") {
    const d = workDoors(L, all, g.latched);
    if (d.open !== g.open || d.latched !== g.latched) {
      if (d.latched !== g.latched) net.send("fx", { s: "latch" });
      g = writeGame({ ...g, ...d }); onDoorsChanged(d.open);
    }
    const humans = all.filter((b) => !b.bot);
    if (all.length && all.every((b) => inExit(L, b)) && (humans.length || ATTRACT)) g = writeGame({ ...g, phase: "clear", endsAt: t + CONFIG.clearFor, times: [...g.times, t - g.at] });
  } else if (g.phase === "clear" && t > g.endsAt) {
    const n = nextLevel(g.lv);
    g = n < LEVELS.length ? writeGame({ ...g, lv: n, phase: "play", at: t, open: "", latched: "" }) : writeGame({ ...g, phase: "done", endsAt: t + CONFIG.doneFor, total: t - g.runAt });
  } else if (g.phase === "done" && t > g.endsAt) g = newRun(g.id + 1);
  if (now - (host.lastSync || 0) > 1000) { host.lastSync = now; const h = all.find((b) => !b.bot) || L.spawn; syncBots({ x: h.x - 0.8, y: h.y }); }
  for (const b of host.bots.values()) botTick(b, dt, now, g, L, all);
  if (now - host.lastBots > 90) { host.lastBots = now; net.setShared("bots", JSON.stringify({ k: host.key, list: botList(host.key) })); }
}

// ── BUDDY BOTS ──────────────────────────────────────────────────────────────────────
/** The bots in level `key`: the host's own copy, or what it last wrote to state. */
function botList(key) {
  if (isHost()) return host.key !== key ? [] : [...host.bots.values()].map((b) => ({ i: b.id, n: b.name, c: b.color, x: +b.x.toFixed(2), y: +b.y.toFixed(2), f: b.f, a: anim(b), pt: b.point }));
  const saved = parse(S.shared.bots, { k: "", list: [] });
  return saved.k === key ? saved.list || [] : [];
}
/** As many buddies as empty seats (a partner who leaves mid-level is replaced at once). A new one appears at `at`. */
function syncBots(at) {
  const want = Math.max(0, CONFIG.seats - livePlayers().length + (ATTRACT ? 1 : 0));
  while (host.bots.size > want) host.bots.delete([...host.bots.keys()].pop());
  while (host.bots.size < want) {
    const used = new Set([...host.bots.values()].map((b) => b.name)), taken = new Set([...takenColors(), myColor]);
    const id = "b" + Math.random().toString(36).slice(2, 6);
    host.bots.set(id, Object.assign(makeBody(at.x, at.y), { id, name: BOT_NAMES.find((n) => !used.has(n)) || "Bot", color: COLORS.find((c) => !taken.has(c) && ![...host.bots.values()].some((b) => b.color === c)) || "#ccc", task: { type: "follow" }, point: null }));
  }
}
function resetBots(g, L) {
  syncBots(L.spawn);
  let n = 1;
  for (const b of host.bots.values()) Object.assign(b, makeBody(L.spawn.x + n++ * 0.8, L.spawn.y), { task: { type: "follow" }, point: null, waitUntil: performance.now() + 400 + Math.random() * 400 });
  host.key = keyOf(g);
}
/** Choose what a bot is doing: go where it was sent, hold a plate, swap sides, or follow its human. */
function botPlan(b, L, g, all) {
  const others = all.filter((o) => o.id !== b.id), friend = others.filter((o) => !o.bot)[0] || others[0];
  if (!friend) return { x: b.x };

    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>${fmt(3600000 - e.score)}</span></li>`).join("") : "<li>No runs yet. Set the first.</li>";
  }).catch(() => { list.innerHTML = "<li>Couldn't load the leaderboard.</li>"; });
}
$("again").onclick = () => { const g = game(); if (!g || g.phase !== "done") return; if (isHost()) newRun(g.id + 1); else net.send("again", {}); };
let actx = null;
function beep(freq, dur, type = "sine", vol = 0.1) {
  if (!actx) return;
  const o = actx.createOscillator(), gn = actx.createGain(); o.type = type; o.frequency.value = freq;
  gn.gain.setValueAtTime(vol, actx.currentTime); gn.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
  o.connect(gn).connect(actx.destination); o.start(); o.stop(actx.currentTime + dur);
}
const takenColors = () => new Set([...Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), ...(parse(S.shared.bots, {}).list || []).map((b) => b.c)]);
/** Two people joined at once with one color (or a bot has it): the one with the higher sessionId picks a free one. */
function fixColor() {
  const others = Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId), bots = parse(S.shared.bots, {}).list || [];
  if (!others.some(([id, p]) => p.c === myColor && id < net.sessionId) && !bots.some((b) => b.c === myColor)) return;
  const taken = takenColors();
  myColor = COLORS.find((c) => !taken.has(c)) || myColor; net.me.set("c", myColor);
}

// ── INPUT ───────────────────────────────────────────────────────────────────────────
const touchUI = matchMedia("(pointer: coarse)").matches && !ATTRACT;
$("padL").hidden = $("padR").hidden = !touchUI;
const wake = () => { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch {} } };
const KEYS = { ArrowLeft: "left", a: "left", A: "left", ArrowRight: "right", d: "right", D: "right" };
addEventListener("keydown", (e) => { wake(); const k = KEYS[e.key]; if (k) { e.preventDefault(); input[k] = true; } if ([" ", "ArrowUp", "w", "W"].includes(e.key)) { e.preventDefault(); if (!e.repeat) input.jump = true; } });
addEventListener("keyup", (e) => { const k = KEYS[e.key]; if (k) input[k] = false; });
for (const b of document.querySelectorAll(".pad button")) {
  const k = b.dataset.k;
  b.addEventListener("pointerdown", (e) => { e.preventDefault(); wake(); b.setPointerCapture(e.pointerId); if (k === "jump") input.jump = true; else input[k] = true; b.classList.add("on"); });
  for (const ev of ["pointerup", "pointercancel"]) b.addEventListener(ev, () => { if (k !== "jump") input[k] = false; b.classList.remove("on"); });
}
// Tap or click the level: send your buddy there. Tap near yourself: call it back to follow you.
cv.addEventListener("pointerdown", (e) => {
  e.preventDefault(); wake();
  const g = game(); if (!g || ATTRACT) return;
  const x = (e.clientX - view.ox) / view.T, y = (e.clientY - view.oy) / view.T;
  const msg = Math.hypot(x - me.x, y - (me.y - 0.5)) < 1.2 ? { x: -1, y: -1 } : { x: +x.toFixed(2), y: +y.toFixed(2) };
  if (isHost()) applyPoint(net.sessionId, msg); else net.send("point", msg);
  if (msg.x >= 0) dust(x, y, "#ffd23f", 6);
});
/** A "point" intent: the bot nearest the sender goes to that spot (or follows again). */
function applyPoint(from, msg) {
  const g = game(); if (!g || !msg) return;
  const L = LEVELS[g.lv], sender = bodies(g).find((b) => b.id === from); if (!sender) return;
  const bot = [...host.bots.values()].sort((a, b) => Math.abs(a.x - sender.x) - Math.abs(b.x - sender.x))[0]; if (!bot) return;
  if (msg.x < 0) { bot.point = null; bot.task = { type: "follow" }; return; }
  let y = Math.floor(Number(msg.y)); const x = Math.max(0.5, Math.min(L.cols - 0.5, Number(msg.x)));
  while (y < L.rows - 1 && !solid(L, Math.floor(x), y + 1, "")) y++; // drop the marker onto the floor below
  bot.point = [+x.toFixed(2), y + 1]; bot.task = { type: "follow" };
}
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastHb = 0, lastHud = 0, seenOpen = "", seenPhase = "";
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; // the first frame can be timed before load: never negative
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  if (isHost()) hostTick(dt, now); else host.wasHost = false;
  const g = game();
  if (g) {
    const L = LEVELS[g.lv];
    myTick(dt, g, L);
    // everyone else, eased toward where they last said they were
    const seen = new Set(), live = new Set(livePlayers());
    const add = (id, s, name, color, bot) => {
      seen.add(id); let v = views.get(id);
      if (!v || Math.hypot(v.x - s.x, v.y - s.y) > 4) { v = { x: s.x, y: s.y, px: s.x }; views.set(id, v); }
      const k = bot && isHost() ? 1 : 1 - Math.pow(0.0005, dt);
      Object.assign(v, { x: v.x + (s.x - v.x) * k, y: v.y + (s.y - v.y) * k, f: s.f || 1, a: s.a, key: s.k || keyOf(g), name, color, bot });
    };
    for (const [id, p] of Object.entries(S.entities.players || {})) { if (id === net.sessionId || !live.has(id)) continue; const s = parse(p.p, null); if (s) add(id, s, p.n || "Player", p.c || "#ccc", false); }
    for (const b of botList(keyOf(g))) add(b.i, b, b.n, b.c, true);
    for (const id of views.keys()) if (!seen.has(id)) views.delete(id);
    bodiesNow = bodies(g);
    if ((g.open || "") !== seenOpen) { onDoorsChanged(g.open || ""); seenOpen = g.open || ""; }
    if (g.phase + g.lv !== seenPhase) {
      seenPhase = g.phase + g.lv;
      if (g.phase === "clear") { toast(g.lv + 1 < LEVELS.length || ATTRACT ? "Level clear!" : "You all got out!", 2000); for (let i = 0; i < 50; i++) sparks.push({ x: L.exits[0].x + 1, y: L.exits[0].y, vx: (Math.random() - 0.5) * 10, vy: -4 - Math.random() * 6, life: 1.4, color: COLORS[i % COLORS.length], s: 0.14 }); beep(660, 0.12); setTimeout(() => beep(880, 0.12), 120); setTimeout(() => beep(1320, 0.25), 240); }
    }
    draw(g, L, dt, now / 1000);
    if (now - lastHud > 150) { lastHud = now; hud(g, L); }
  }
}

(async function start() {
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("point", (msg, from) => { if (isHost()) applyPoint(from, msg); });
  net.on("again", () => { const g = game(); if (isHost() && g && g.phase === "done") newRun(g.id + 1); });
  net.on("fx", () => beep(880, 0.15, "triangle", 0.08));
  net.onDisconnect(() => { dropped = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { dropped = false; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = takenColors();
  myColor = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  if (ATTRACT) Object.assign(CONFIG, { seats: 2, clearFor: 1400 });
  requestAnimationFrame(frame);
})();
</script>
